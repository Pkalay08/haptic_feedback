# ---- Core / Logging ----
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# ---- UART (physical) ----
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# ---- Bluetooth ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MyNRF UART"
CONFIG_BT_DEVICE_APPEARANCE=0

# ---- BLE UART Service (NUS) ----
CONFIG_BT_NUS=y

# ---- Increase buffer counts (NUS needs a few) ----
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_ACL_RX_COUNT=8
CONFIG_BT_ATT_PREPARE_COUNT=4

# ---- Disable unused features to save RAM/flash ----
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_CENTRAL=n

# ---- Heap for kernel ----
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048